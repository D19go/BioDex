name: CI

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes da lógica (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test FaunaLens.Tests/FaunaLens.Tests.csproj -c Release --logger "trx;LogFileName=resultado.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-testes
          path: FaunaLens.Tests/TestResults/*.trx

  android:
    name: Build do app Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install android
      - run: >
          dotnet build FaunaLens/FaunaLens.csproj -c Release
          -p:InstallAndroidDependencies=true
          -p:AcceptAndroidSDKLicenses=True
      - uses: actions/upload-artifact@v4
        with:
          name: biodex-apk
          path: FaunaLens/bin/Release/net10.0-android/*.apk
          if-no-files-found: warn

  builder:
    name: Build do FaunaPack Builder (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build FaunaPackBuilder/FaunaPackBuilder.csproj -c Release

  python:
    name: Checagem dos scripts Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile FaunaLens/Server/main.py FaunaLens/tools/*.py
