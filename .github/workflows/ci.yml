name: CI

on:
  push:
    branches: [main, "fix/**", "feature/**", "testes*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    name: Testes da lógica (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test FaunaLens.Tests/FaunaLens.Tests.csproj -c Release --logger "trx;LogFileName=resultado.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-testes
          path: FaunaLens.Tests/TestResults/*.trx

  android:
    name: Build do app Android (APK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0 = APK principal. Nas branches testes* (menos testes_Super), em vez dele são gerados 3 clones com pacotes
        # numerados (com.dsc.faunalens1, 2 e 3), que podem ser instalados ao lado do principal.
        # testes_Super gera só o BioDex_Super (BioCLIP 2), sem clones.
        clone: ${{ startsWith(github.ref_name, 'testes') && github.ref_name != 'testes_Super' && fromJSON('[1,2,3]') || fromJSON('[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install android
      - name: Compilar o APK
        env:
          IS_SUPER: ${{ github.ref_name == 'testes_Super' }}
        run: |
          EXTRA=""
          if [ "$IS_SUPER" = "true" ]; then
            # "super" é palavra reservada em Java: o pacote usa "faunalens_super".
            EXTRA="-p:BioDexVariant=super -p:ApplicationId=com.dsc.faunalens_super -p:ApplicationTitle=BioDex_Super"
          elif [ "${{ matrix.clone }}" -gt 0 ]; then
            EXTRA="-p:ApplicationId=com.dsc.faunalens${{ matrix.clone }}"
          fi
          dotnet build FaunaLens/FaunaLens.csproj -c Release \
            -p:InstallAndroidDependencies=true \
            -p:AcceptAndroidSDKLicenses=True $EXTRA
      - name: Nomear o APK para publicação
        env:
          IS_SUPER: ${{ github.ref_name == 'testes_Super' }}
        run: |
          mkdir -p out
          APK=$(ls FaunaLens/bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then APK=$(ls FaunaLens/bin/Release/net10.0-android/*.apk | head -n 1); fi
          if [ "$IS_SUPER" = "true" ]; then
            NAME="BioDex_Super.apk"
          elif [ "${{ matrix.clone }}" -gt 0 ]; then
            NAME="BioDex-clone${{ matrix.clone }}.apk"
          else
            NAME="BioDex-debug.apk"
          fi
          echo "$APK -> $NAME"
          cp "$APK" "out/$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: biodex-apk-${{ matrix.clone }}
          path: out/*.apk
          if-no-files-found: error

  modelo:
    name: Exportar BioCLIP 2 para ONNX (BioDex_Super)
    runs-on: ubuntu-latest
    if: github.ref_name == 'testes_Super'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências (PyTorch só CPU)
        run: |
          python -m pip install --upgrade pip
          # torch e torchvision do mesmo índice CPU: versões diferentes quebram o import (operator torchvision::nms).
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install open_clip_torch onnx onnxruntime numpy huggingface_hub
      - name: Exportar o encoder visual do BioCLIP 2
        working-directory: FaunaLens/tools
        run: python export_model.py --model bioclip2 --output "$GITHUB_WORKSPACE/out/bioclip2_image.onnx"
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-super
          path: out/bioclip2_image.onnx
          if-no-files-found: error

  builder:
    name: Build do FaunaPack Builder (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build FaunaPackBuilder/FaunaPackBuilder.csproj -c Release

  python:
    name: Checagem dos scripts Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile FaunaLens/Server/main.py FaunaLens/tools/*.py

  release:
    name: Publicar APK na aba Releases
    needs: [testes, android, builder, python, modelo]
    # modelo fica "skipped" fora da testes_Super; isso não bloqueia a publicação.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.testes.result == 'success' && needs.android.result == 'success' && needs.builder.result == 'success' && needs.python.result == 'success' && (needs.modelo.result == 'success' || needs.modelo.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: biodex-apk-*
          path: apk
          merge-multiple: true
      - name: Verificar assinatura dos APKs
        run: |
          echo "APKs gerados:"; ls -la apk
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | tail -n 1 || true)
          for APK in apk/*.apk; do
            if [ -n "$APKSIGNER" ]; then
              echo "Verificando assinatura de $APK"
              "$APKSIGNER" verify --verbose --print-certs "$APK"
            else
              echo "apksigner não encontrado; assinatura de $APK não verificada"
            fi
          done
      - name: Criar/atualizar a release "ultima-versao"
        if: github.ref_name != 'testes_Super'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete ultima-versao --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create ultima-versao apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "BioDex (build automático)" \
            --notes "APK gerado automaticamente a partir do commit $GITHUB_SHA (branch $GITHUB_REF_NAME). Só é publicado depois que os testes e as compilações passam. É um build de teste: instale e use por sua conta e risco. Os arquivos BioDex-clone1, 2 e 3 são cópias de teste com pacotes separados (com.dsc.faunalens1, 2 e 3) e podem ser instaladas junto com as demais."
      - uses: actions/download-artifact@v4
        if: github.ref_name == 'testes_Super'
        with:
          name: modelo-super
          path: modelo
      - name: Publicar BioDex_Super em "super-versao" (não mexe em ultima-versao)
        if: github.ref_name == 'testes_Super'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete super-versao --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create super-versao apk/BioDex_Super.apk modelo/bioclip2_image.onnx \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "BioDex_Super (BioCLIP 2, teste)" \
            --notes "Build de teste BioDex_Super a partir do commit $GITHUB_SHA. Usa o BioCLIP 2 (768 dimensões) e packs próprios em FaunaPacks_Super. Não substitui nem remove os outros builds."
