name: CI

on:
  push:
    branches: [main, "fix/**", "feature/**", "testes*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    name: Testes da lógica (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test FaunaLens.Tests/FaunaLens.Tests.csproj -c Release --logger "trx;LogFileName=resultado.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-testes
          path: FaunaLens.Tests/TestResults/*.trx

  android:
    name: Build do app Android (APK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0 = APK principal. Nas branches testes*, em vez dele são gerados 3 clones com pacotes numerados
        # (com.dsc.faunalens1, 2 e 3), que podem ser instalados ao lado do principal.
        clone: ${{ startsWith(github.ref_name, 'testes') && fromJSON('[1,2,3]') || fromJSON('[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install android
      - name: Baixar o ONNX Runtime oficial para Android (AAR)
        run: |
          mkdir -p FaunaLens.OnnxAndroid/libs
          curl -fsSL -o FaunaLens.OnnxAndroid/libs/onnxruntime-android-1.22.0.aar \
            https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.22.0/onnxruntime-android-1.22.0.aar
      - name: Baixar o BioCLIP para embutir no APK
        # O modelo (cerca de 170 MB) não é versionado no git. Vai para a pasta Assets, que o build embute no APK.
        run: |
          mkdir -p FaunaLens/Assets
          curl -fsSL --retry 3 -o FaunaLens/Assets/bioclip_image.onnx \
            "https://huggingface.co/m3r1al/naturalist-bioclip-v1/resolve/main/image_encoder.onnx?download=true"
          ls -lh FaunaLens/Assets/bioclip_image.onnx
      - name: Compilar o APK
        run: |
          ARGS=()
          if [ "${{ matrix.clone }}" -gt 0 ]; then
            # Nome do ícone e pacote próprios de cada clone: BioDex1, BioDex2, BioDex3.
            ARGS=("-p:ApplicationId=com.dsc.faunalens${{ matrix.clone }}" "-p:ApplicationTitle=BioDex${{ matrix.clone }}")
          fi
          dotnet build FaunaLens/FaunaLens.csproj -c Release \
            -p:InstallAndroidDependencies=true \
            -p:AcceptAndroidSDKLicenses=True "${ARGS[@]}"
      - name: Nomear o APK para publicação
        run: |
          mkdir -p out
          APK=$(ls FaunaLens/bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then APK=$(ls FaunaLens/bin/Release/net10.0-android/*.apk | head -n 1); fi
          if [ "${{ matrix.clone }}" -gt 0 ]; then
            NAME="BioDex-clone${{ matrix.clone }}.apk"
          else
            NAME="BioDex-debug.apk"
          fi
          echo "$APK -> $NAME"
          cp "$APK" "out/$NAME"
          # Diagnóstico: sem a biblioteca nativa do ONNX Runtime o modelo BioCLIP não carrega no celular.
          if unzip -l "out/$NAME" | grep -q "libonnxruntime.so"; then
            echo "libonnxruntime.so presente no APK:"
            unzip -l "out/$NAME" | grep "libonnxruntime.so"
          else
            echo "::warning::libonnxruntime.so NÃO está no APK $NAME; a identificação offline vai falhar no celular."
          fi
          # O modelo embutido aparece como assets/bioclip_image.onnx. Sem ele, o app baixa a IA na primeira abertura.
          if unzip -l "out/$NAME" | grep -q "assets/bioclip_image.onnx"; then
            echo "Modelo BioCLIP embutido no APK:"
            unzip -l "out/$NAME" | grep "assets/bioclip_image.onnx"
          else
            echo "::warning::O modelo BioCLIP NÃO está no APK $NAME (o app vai precisar baixá-lo)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: biodex-apk-${{ matrix.clone }}
          path: out/*.apk
          if-no-files-found: error

  builder:
    name: Build do FaunaPack Builder (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build FaunaPackBuilder/FaunaPackBuilder.csproj -c Release

  python:
    name: Checagem dos scripts Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile FaunaLens/Server/main.py FaunaLens/tools/*.py

  release:
    name: Publicar APK na aba Releases
    needs: [testes, android, builder, python]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Uma publicação por vez: pushes seguidos em branches diferentes apagavam e recriavam a
    # mesma release "ultima-versao" ao mesmo tempo, e uma das execuções falhava com 404.
    concurrency:
      group: publicar-ultima-versao
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: biodex-apk-*
          path: apk
          merge-multiple: true
      - name: Criar/atualizar a release "ultima-versao"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "APKs gerados:"; ls -la apk
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | tail -n 1 || true)
          for APK in apk/*.apk; do
            if [ -n "$APKSIGNER" ]; then
              echo "Verificando assinatura de $APK"
              "$APKSIGNER" verify --verbose --print-certs "$APK"
            else
              echo "apksigner não encontrado; assinatura de $APK não verificada"
            fi
          done
          gh release delete ultima-versao --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create ultima-versao apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "BioDex (build automático)" \
            --notes "APK gerado automaticamente a partir do commit $GITHUB_SHA (branch $GITHUB_REF_NAME). Só é publicado depois que os testes e as compilações passam. É um build de teste: instale e use por sua conta e risco. Os arquivos BioDex-clone1, 2 e 3 são cópias de teste com pacotes separados (com.dsc.faunalens1, 2 e 3) e podem ser instaladas junto com as demais."
